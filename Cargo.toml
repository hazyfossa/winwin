[package]
name = "winwin"
version = "0.1.0"
edition = "2024"

[dependencies]
bon = { version = "3.10.3", optional = true }
pastey = { version = "0.2.3", optional = true }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", optional = true, features = ["derive"] }
tracing-core = { version = "0.1.36", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, default-features = false, features = ["fmt", "registry", "std"] }
windows = { version = "0.62.2", features = ["Win32_Foundation"] }

[features]
messagebox = ["dep:pastey", "dep:bon", "windows/Win32_UI_WindowsAndMessaging"]
lock-aspect-ratio = ["windows/Win32_UI_Shell"]
blob = ["windows/Win32_System_LibraryLoader"]
serde = ["dep:serde"]
tracing-layer = ["dep:tracing-core", "dep:tracing-subscriber", "windows/Win32_System_Diagnostics_Debug"]
